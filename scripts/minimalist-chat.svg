<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#27272a" stroke-width="2"/>

  <!-- Chat bubble -->
  <path d="M34 40 C34 33.37 39.37 28 46 28 L82 28 C88.63 28 94 33.37 94 40 L94 68 C94 74.63 88.63 80 82 80 L52 80 L38 92 C36.5 93.3 34 92.2 34 90.2 Z" 
        fill="url(#bubble)" opacity="0.9" filter="url(#glow)"/>

  <!-- Terminal / sparkle indicator -->
  <path d="M46 54 L58 54" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M46 64 L72 64" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- AI Sparkle star -->
  <path d="M84 42 Q84 50 92 50 Q84 50 84 58 Q84 50 76 50 Q84 50 84 42 Z" fill="url(#sparkle)"/>
</svg>
