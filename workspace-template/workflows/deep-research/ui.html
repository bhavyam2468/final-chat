<ui>
<x-card :title="run.title">
  <x-row>
    <x-text>{{run.status}} · {{run.activity}}</x-text>
    <x-spacer />
    <x-badge :tone="run.status === 'done' ? 'success' : 'info'">{{count(run.sources, function (s) { return s.read })}} of {{run.sources.length}} pages</x-badge>
  </x-row>
  <x-progress :value="run.progress" max="1" />
  <ul>
    <li each="s in run.steps">{{s.title}} — {{s.status}}{{s.detail ? ' · ' + s.detail : ''}}</li>
  </ul>
  <x-table dense sortable
    :data="run.sources.map(function (s) { return { source: s.title, words: s.words || 0, opened: s.read ? 'yes' : 'no' } })"
    cols="l,r,c" />
  <x-callout tone="info" title="What it did">
    <ul><li each="l in run.log">{{l.text}}</li></ul>
  </x-callout>
</x-card>
<script>
  // The host pushes the run again on every change, so this document is written once and stays live while
  // the work happens — no polling, no reload, and the same file is what you see once it is done.
  Blocks.on("run", (r) => { S.run = r; });
</script>
</ui>
